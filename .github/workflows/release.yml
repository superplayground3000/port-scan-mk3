# Release — builds, verifies and publishes the Windows x64 release assets for a
# pushed tag. Nothing here is trusted from the repository: every asset is built
# from the tagged source on a clean runner, checksummed, and then EXECUTED
# before anything is published.
#
# The three jobs are deliberately separate machines:
#   package       (ubuntu)  build from source, archive, checksum
#   smoke-windows (windows) verify the checksum, extract, RUN every EXE
#   publish       (ubuntu)  create the GitHub Release — tag pushes only
#
# Why a Windows runner is not optional: a Windows EXE cannot be executed on the
# Linux packaging runner, and the Docker e2e suite (constitution V) runs Linux
# containers, so it validates Linux behavior only. Without this job the .exe
# assets would be published having never run anywhere.
#
# workflow_dispatch runs the whole build + package + smoke path WITHOUT
# publishing, so the pipeline can be exercised on a branch. The publish job is
# gated on the event type as well as the ref, because a dispatch can be started
# on a tag ref.
#
# Scope: Windows amd64 only. Windows ARM64 is deliberately out of scope
# (issue #65). Linux binaries are still built, because `make build` builds every
# target and runs scripts/verify_dist.sh over all of them, but they are not
# published by this workflow.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the publish job is granted write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and package (Linux)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.version.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs the tags, and BUILD_TIME is derived from the
          # commit. A shallow checkout would stamp every artifact with a bare
          # commit and mislabel the release.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine release version
        id: version
        run: |
          set -euo pipefail
          described="$(git describe --always --dirty)"
          case "$described" in
            *-dirty)
              echo "The checkout is dirty ('$described'); a release must be reproducible" \
                   "from a commit." >&2
              exit 1
              ;;
          esac
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$described" != "$tag" ]; then
              echo "git describe reports '$described' but the tag is '$tag'." >&2
              echo "Release tags must be ANNOTATED (git tag -a) and point at the commit" \
                   "being released, or the binaries would report a version that does not" \
                   "match the release they ship in." >&2
              exit 1
            fi
          fi
          echo "version=$described" >> "$GITHUB_OUTPUT"
          echo "archive=port-scan-mk3_${described}_windows_amd64.zip" >> "$GITHUB_OUTPUT"
          echo "Releasing $described"

      # Everything derived from the ref reaches the shell through `env:`, never
      # through `${{ }}` inside a run body. A tag name is attacker-controllable
      # in a fork/PR world, and interpolation splices it into the script text
      # before bash ever sees it, so a quote or backtick in the tag would
      # execute. As an environment variable it is only ever data.
      - name: Build and package release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/package_release.sh \
            --out dist/release \
            --target windows \
            --version "$RELEASE_VERSION"

      - name: Show what will be published
        run: |
          ls -l dist/release
          cat dist/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    name: Smoke test the Windows assets (native)
    needs: package
    runs-on: windows-latest
    steps:
      # The smoke script discovers the expected commands from cmd/*/main.go, so
      # it needs the source tree as well as the assets.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Verify the published checksum
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check --strict SHA256SUMS.txt

      - name: Extract the archive
        shell: pwsh
        env:
          RELEASE_ARCHIVE: ${{ needs.package.outputs.archive }}
        run: |
          Expand-Archive -Path "assets/$env:RELEASE_ARCHIVE" `
                         -DestinationPath extracted -Force

      - name: Verify the per-binary checksums
        shell: bash
        run: |
          set -euo pipefail
          cd extracted
          sha256sum --check --strict SHA256SUMS.txt

      - name: Run every command (the gate before publication)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: bash scripts/smoke_release.sh extracted "$RELEASE_VERSION"

  publish:
    name: Publish the GitHub Release
    needs: [package, smoke-windows]
    # Tag pushes only. The event check is load-bearing: workflow_dispatch can be
    # started on a tag ref, and a manual run must never publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${VERSION#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$VERSION" --title "$VERSION" --notes-file "$notes" \
              assets/*.zip assets/SHA256SUMS.txt
          else
            echo "No $notes; publishing with generated notes." >&2
            gh release create "$VERSION" --title "$VERSION" --generate-notes \
              assets/*.zip assets/SHA256SUMS.txt
          fi
