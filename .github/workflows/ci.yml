# CI — enforces the Quality Gates from .claude/rules/constitution.md on every
# push and pull request. This is the automated backstop that keeps the baseline
# green regardless of which agent or human touches the code next.
#
# Gates (constitution "Quality Gates" + Principle IV):
#   - gofmt clean, go vet, go build            (fast structural checks)
#   - go test -race across all packages
#   - coverage gate >= 85% total               (scripts/coverage_gate.sh)
#   - isolated Docker e2e                       (e2e/run_e2e.sh)
#   - cross-platform build + test on Windows    (Technology Stack: win + linux)
#
# The Linux "gate" job mirrors `bash scripts/verify.sh` exactly, so a green
# local run predicts a green CI run.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Uses the `go` directive in go.mod (Go 1.24.x per constitution).
          go-version-file: go.mod
          cache: true
      - name: gofmt (formatting)
        run: |
          files="$(git ls-files '*.go')"
          if [ -z "$files" ]; then echo "gofmt: no Go files"; exit 0; fi
          unformatted="$(gofmt -l -- $files)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean (run 'make fmt'):"; echo "$unformatted"; exit 1
          fi
          echo "gofmt: clean"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # `go build ./...` only proves the packages compile for the host. This
      # exercises the real release path: the fail-fast cross-builds plus
      # scripts/verify_dist.sh, which asserts every dist/ artifact exists and
      # really targets the OS/ARCH its directory claims. `clean` first so a
      # committed-but-stale binary cannot satisfy the gate (issue #65).
      - name: make build (cross-platform artifacts + artifact gate)
        run: make clean build
      - name: go test -race
        run: go test -race -shuffle=on ./...
      - name: coverage gate (>= 85%)
        run: bash scripts/coverage_gate.sh
      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: ignore

  windows-build-test:
    name: Cross-platform build + test (Windows)
    runs-on: windows-latest
    # Blocking. The cross-platform test assumptions this job was waiting on are
    # fixed (PRs #48/#49/#50) and master is green on Windows with zero skips, so
    # a Windows regression must now fail the run. Do not re-add
    # continue-on-error to get a red run green — fix the cause, and see
    # docs/MAINTENANCE.md section 6.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  e2e:
    name: Isolated e2e (Docker Compose)
    runs-on: ubuntu-latest
    # Non-blocking for now: one failure-injection scenario (api_timeout) is
    # timing-sensitive — the tiny fail-scenario scan can finish before the
    # pressure-timeout becomes fatal on fast runners, so it exits 0 instead of
    # failing. Tracked for a follow-up fix that makes the scenario deterministic;
    # see docs/MAINTENANCE.md "Known e2e follow-ups". Flip to blocking once fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run e2e suite
        run: bash e2e/run_e2e.sh
      - name: upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e/out/
          if-no-files-found: ignore
