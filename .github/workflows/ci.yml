# CI — enforces the Quality Gates from .claude/rules/constitution.md on every
# push and pull request. This is the automated backstop that keeps the baseline
# green regardless of which agent or human touches the code next.
#
# Gates (constitution "Quality Gates" + Principle IV):
#   - gofmt clean, go vet, go build            (fast structural checks)
#   - go test -race across all packages
#   - coverage gate >= 85% total               (scripts/coverage_gate.sh)
#   - isolated Docker e2e                       (e2e/run_e2e.sh)
#   - cross-platform build + test on Windows    (Technology Stack: win + linux)
#
# The Linux "gate" job mirrors `bash scripts/verify.sh` exactly, so a green
# local run predicts a green CI run.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Uses the `go` directive in go.mod (Go 1.24.x per constitution).
          go-version-file: go.mod
          cache: true
      - name: gofmt (formatting)
        run: |
          files="$(git ls-files '*.go')"
          if [ -z "$files" ]; then echo "gofmt: no Go files"; exit 0; fi
          unformatted="$(gofmt -l -- $files)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean (run 'make fmt'):"; echo "$unformatted"; exit 1
          fi
          echo "gofmt: clean"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # `go build ./...` only proves the packages compile for the host. This
      # exercises the real release path: the fail-fast cross-build recipes plus
      # scripts/verify_dist.sh, which asserts every artifact exists and really
      # targets the OS/ARCH its directory claims (issue #65).
      #
      # It calls the SCRIPT, not `make clean build`, for two reasons: the same
      # script runs inside `bash scripts/verify.sh`, so local and CI cannot
      # drift apart; and it builds into a temporary DIST_DIR instead of `clean`
      # -ing and rewriting the tracked dist/ tree.
      - name: release build recipes (cross-build + artifact gate)
        run: bash scripts/test_build_recipes.sh
      - name: go test -race
        run: go test -race -shuffle=on ./...
      - name: coverage gate (>= 85%)
        run: bash scripts/coverage_gate.sh
      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: ignore

  windows-build-test:
    name: Native Windows gate
    runs-on: windows-latest
    # Blocking. The cross-platform test assumptions this job was waiting on are
    # fixed (PRs #48/#49/#50) and master is green on Windows with zero skips, so
    # a Windows regression must now fail the run. Do not re-add
    # continue-on-error to get a red run green — fix the cause, and see
    # docs/MAINTENANCE.md section 6.
    #
    # All the logic lives in the scripts so it is reproducible on a developer's
    # machine (.claude/rules/90-letter-to-future-sessions.md: keep the workflow
    # thin, put gates in the scripts). scripts/windows_setup_mingw.ps1
    # PROVISIONS the race prerequisites explicitly — a 64-bit MinGW-w64 gcc and
    # ASCII TEMP/TMP/GOTMPDIR — instead of trusting whatever the windows-latest
    # image happens to preinstall (issue #63; that image-dependence breaks
    # silently when GitHub changes the image). It fails loudly if a 64-bit gcc
    # cannot be provided, so the gate never degrades to a non-race run. The gate
    # script then builds and launches every cmd/ .exe, runs
    # `go test -race -shuffle=on ./...` with the race detector proven armed, and
    # drives a loopback-only generate-buckets -> scan -> resume pipeline under a
    # path containing spaces. Both scripts, their ordering, and the provisioning
    # they perform are pinned by internal/ciguard so a future edit that drops the
    # setup fails `make verify` on every platform instead of quietly reverting to
    # image-dependence. Docker e2e (the job below) is LINUX coverage only — it
    # never runs a .exe.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: provision race prerequisites (64-bit MinGW-w64 + ASCII temp)
        shell: pwsh
        run: ./scripts/windows_setup_mingw.ps1
      - name: native Windows gate
        shell: pwsh
        run: ./scripts/windows_gate.ps1

  e2e:
    name: Isolated e2e (Docker Compose)
    runs-on: ubuntu-latest
    # Blocking. The api_timeout scenario used to be timing-sensitive (the scan
    # could finish before the pressure-timeout became fatal); it is now
    # event-driven — it waits for the mock to serve the scanner's fatal
    # threshold of pressure failures before judging the run, and asserts a
    # resumable mid-flight snapshot (issue #71). No scenario races a clock.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run e2e suite
        run: bash e2e/run_e2e.sh
      - name: upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e/out/
          if-no-files-found: ignore
